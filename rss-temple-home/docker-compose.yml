services:
  init-rss_temple_home:
    image: alpine:3
    volumes:
      - caddy_srv:/srv/
    command: chown -R 1000:1000 /srv/
    network_mode: none
  caddy-rss_temple_home:
    image: caddy:2-alpine
    ports:
      - "3000:3000"
    volumes:
      - caddy_data:/data/
      - caddy_config:/config/
      - caddy_srv:/srv/
    networks:
      - default
      - rss_temple_home_net
  rss_temple_home:
    command: >
      ash -c "
        [ \"$$(ls -A /srv/)\" ] || echo '<html><body><h1>Building Site…</h1></body></html>' > /srv/index.html
        yarn build

        rm -rf /srv/* && cp -R /build/_site/* /srv/

        while :; do
          sleep 3600
        done
      "
    volumes:
      - caddy_srv:/srv/
    networks:
      - rss_temple_home_net
    depends_on:
      init-rss_temple_home:
        condition: service_completed_successfully
volumes:
  caddy_data:
  caddy_config:
  caddy_srv:
networks:
  rss_temple_home_net:
    internal: true
